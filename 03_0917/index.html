<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <p>Hello world</p>
        <script>
            const bmi=27;
            // constは次の変数の値が変わらないことです。
            document.write( "BMIは" + bmi + "です。<br>" );

            if( bmi >= 27 ){       //bmi ≧ 27
                document.write( "bmiは２７以上です<br>" );
                document.write( "BMI:" + bmi + "<br>" );
            }

            if( bmi < 27 ){
                document.write( "bmiは27未満です" );
            }

            // 　==　は左辺等辺が等しいことを表す
            if( bmi == 26 ){
                document.write( "bmiが２６です<br>" );
            }

            // != は左辺と右辺が異なることを表す。
            if( bmi != 25 ){
            document.write( "bmiが２５ではない<br>" );
            }

            // gakusekibangou == 26000 && gakka == "Web"

            // 　学籍番号
            const gakuseki = 25001;

            if( gakuseki >= 26000 ){
                document.write( "2026年入学<br>" );
            } else {
                document.write( "2025年までに入学" );
            }

        </script>
    </body>
</html>
